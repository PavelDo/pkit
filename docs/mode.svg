<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="Target working mode: an intake layer where the humans write a work-package issue with acceptance criteria; an execution layer where an orchestrator commits a plan and spawns Sonnet workers in worktrees that open draft PRs immediately; and a verification layer of CI required checks, an independent blind-judge review, and a human merge seat, feeding a merge queue into main.">
<rect x="0" y="0" width="880" height="470" fill="#FAFBFC"/>
<defs>
<marker id="t1" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#1B2431"/></marker>
<marker id="t2" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#35618E"/></marker>
</defs>
<g font-family="Courier New, monospace" font-size="12" fill="#5B6675">
<text x="16" y="26" letter-spacing="2">1 - INTAKE: the humans own the spec</text>
<text x="16" y="168" letter-spacing="2">2 - EXECUTION: agents own implementation</text>
<text x="16" y="330" letter-spacing="2">3 - VERIFICATION: the platform owns the gates</text>
</g>
<g fill="none" stroke="#D9DFE7" stroke-width="1">
<line x1="16" y1="148" x2="864" y2="148"/>
<line x1="16" y1="310" x2="864" y2="310"/>
</g>

<g fill="none" stroke="#1B2431" stroke-width="1.3">
<rect x="40" y="44" width="260" height="84" rx="4"/>
<rect x="420" y="56" width="180" height="60" rx="4"/>
</g>
<g fill="#1B2431" font-size="12.5">
<text x="54" y="66" font-weight="600">Work-package issue</text>
<text x="54" y="86" font-size="11.5">acceptance criteria - file pointers</text>
<text x="54" y="102" font-size="11.5">decided vs open - delegation boundary</text>
<text x="54" y="118" font-size="11.5">do-not-touch list (PO brief template)</text>
<text x="434" y="80" font-weight="600">Orchestrator session</text>
<text x="434" y="98" font-size="11.5">plans, gates, never codes</text>
</g>
<g fill="none" stroke="#1B2431" stroke-width="1.3">
<line x1="300" y1="86" x2="418" y2="86" marker-end="url(#t1)"/>
</g>
<text x="358" y="78" font-size="11" fill="#5B6675" font-family="Courier New, monospace" text-anchor="middle">mention / webhook,</text>
<text x="358" y="104" font-size="11" fill="#5B6675" font-family="Courier New, monospace" text-anchor="middle">acked, not polled</text>

<g fill="none" stroke="#1B2431" stroke-width="1.3">
<rect x="40" y="188" width="200" height="76" rx="4"/>
<rect x="300" y="182" width="130" height="36" rx="4"/>
<rect x="300" y="228" width="130" height="36" rx="4"/>
<rect x="470" y="182" width="130" height="36" rx="4"/>
<rect x="470" y="228" width="130" height="36" rx="4"/>
<rect x="660" y="196" width="176" height="60" rx="4"/>
</g>
<g fill="#1B2431" font-size="12.5">
<text x="54" y="210" font-weight="600">Committed PLAN.md</text>
<text x="54" y="228" font-size="11.5">phases - branches - AC fixed</text>
<text x="54" y="244" font-size="11.5">before any code (swarm schema)</text>
<text x="314" y="204" font-size="11.5" font-family="Courier New, monospace">worker ph-1 - Sonnet</text>
<text x="314" y="250" font-size="11.5" font-family="Courier New, monospace">worker ph-2 - Sonnet</text>
<text x="484" y="204" font-size="11.5" font-family="Courier New, monospace">worktree ph-1</text>
<text x="484" y="250" font-size="11.5" font-family="Courier New, monospace">worktree ph-2</text>
<text x="674" y="218" font-weight="600">Draft PR at first commit</text>
<text x="674" y="236" font-size="11.5">crash-safe - status derived</text>
<text x="674" y="250" font-size="11.5">from PRs, never from prose</text>
</g>
<g fill="none" stroke="#1B2431" stroke-width="1.3">
<line x1="464" y1="128" x2="220" y2="186" marker-end="url(#t1)"/>
<line x1="240" y1="210" x2="298" y2="200" marker-end="url(#t1)"/>
<line x1="240" y1="240" x2="298" y2="246" marker-end="url(#t1)"/>
<line x1="430" y1="200" x2="468" y2="200" marker-end="url(#t1)"/>
<line x1="430" y1="246" x2="468" y2="246" marker-end="url(#t1)"/>
<line x1="600" y1="200" x2="658" y2="214" marker-end="url(#t1)"/>
<line x1="600" y1="246" x2="658" y2="236" marker-end="url(#t1)"/>
</g>
<text x="330" y="160" font-size="11" fill="#5B6675" font-family="Courier New, monospace">commits plan, spawns workers, escalates up only at decision points</text>

<g fill="none" stroke="#35618E" stroke-width="1.6">
<rect x="40" y="352" width="196" height="64" rx="4"/>
<rect x="276" y="352" width="216" height="64" rx="4"/>
<rect x="532" y="352" width="176" height="64" rx="4"/>
</g>
<g fill="none" stroke="#1B2431" stroke-width="1.3">
<rect x="748" y="340" width="96" height="36" rx="4"/>
<rect x="748" y="404" width="96" height="36" rx="18"/>
</g>
<g fill="#35618E" font-size="12.5">
<text x="54" y="374" font-weight="600">CI required checks</text>
<text x="54" y="392" font-size="11.5" fill="#1B2431">on the working base,</text>
<text x="54" y="406" font-size="11.5" fill="#1B2431">branch protection, not chat rules</text>
<text x="290" y="374" font-weight="600">Independent review team</text>
<text x="290" y="392" font-size="11.5" fill="#1B2431">blind-judge, fresh context,</text>
<text x="290" y="406" font-size="11.5" fill="#1B2431">never the implementer, authorship masked</text>
<text x="546" y="374" font-weight="600">Human merge seat</text>
<text x="546" y="392" font-size="11.5" fill="#1B2431">schema - permissions - API-breaking</text>
<text x="546" y="406" font-size="11.5" fill="#1B2431">at least 1 required review</text>
</g>
<g fill="#1B2431" font-size="12">
<text x="764" y="362" font-weight="600">merge queue</text>
<text x="784" y="426" font-weight="600">main</text>
</g>
<g fill="none" stroke="#35618E" stroke-width="1.4">
<line x1="748" y1="270" x2="140" y2="350" marker-end="url(#t2)"/>
<line x1="748" y1="278" x2="384" y2="350" marker-end="url(#t2)"/>
<line x1="748" y1="286" x2="620" y2="350" marker-end="url(#t2)"/>
<line x1="708" y1="384" x2="746" y2="368" marker-end="url(#t2)"/>
<line x1="796" y1="376" x2="796" y2="402" marker-end="url(#t2)"/>
</g>
<path d="M 40 384 C 8 384 8 86 38 86" fill="none" stroke="#1B2431" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#t1)"/>
<text x="30" y="292" font-size="11" fill="#5B6675" font-family="Courier New, monospace" transform="rotate(-90 30 292)" text-anchor="start">evidence + PR links back to issue</text>
</svg>
